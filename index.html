<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>わんも～推し犬総選挙 結果発表</title>

<style>

@font-face{
    font-family:'Panda';
    src:url('pandabakery.ttf');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:url('haikei.png') center center / cover no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

/* 背景ぼかし＆明るさ */

body::before{
    content:'';
    position:absolute;
    inset:0;

    backdrop-filter:blur(2px);

    background:
    rgba(255,255,255,0.08);

    z-index:0;
}

/* わんも〜Cafeロゴ */

.cafe-logo{
    position:absolute;

    right:40px;
    bottom:30px;

    width:180px;

    z-index:3;

    opacity:0;

    animation:fadeUp 1.5s ease forwards;
    animation-delay:1.2s;
}

/* 真ん中 */

.center{
    position:relative;

    z-index:2;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    animation:fadeMain 1.5s ease;
}

/* メインロゴ */

.main-logo{
    width:min(75vw,900px);

    filter:
    drop-shadow(0 8px 20px rgba(0,0,0,0.25));

    animation:floatLogo 4s ease-in-out infinite;
}

/* 結果発表 */

.title{
    margin-top:20px;

    font-family:'Panda';

    font-size:clamp(42px,5vw,90px);

    color:#7b4b35;

    text-shadow:
    0 4px 0 #fff,
    0 8px 12px rgba(0,0,0,0.15);

    letter-spacing:4px;

    opacity:0;

    animation:fadeUp 1.4s ease forwards;
    animation-delay:0.5s;
}

/* サブ */

.sub{
    margin-top:12px;

    font-family:'Panda';

    font-size:clamp(18px,1.5vw,28px);

    color:#8d6b58;

    letter-spacing:3px;

    opacity:0;

    animation:fadeUp 1.5s ease forwards;
    animation-delay:0.9s;
}

/* キラキラ */

.sparkle{
    position:absolute;

    width:12px;
    height:12px;

    background:#fff7b8;

    border-radius:50%;

    opacity:0.8;

    animation:sparkle 3s infinite;
}

.s1{
    top:18%;
    left:22%;
}

.s2{
    top:30%;
    right:24%;
    animation-delay:1s;
}

.s3{
    bottom:25%;
    left:28%;
    animation-delay:2s;
}

.s4{
    bottom:20%;
    right:30%;
    animation-delay:1.5s;
}

@keyframes fadeMain{
    from{
        opacity:0;
        transform:scale(0.95);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes floatLogo{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-10px);
    }
    100%{
        transform:translateY(0px);
    }
}

@keyframes sparkle{
    0%{
        transform:scale(0.8);
        opacity:0.3;
    }

    50%{
        transform:scale(1.5);
        opacity:1;
    }

    100%{
        transform:scale(0.8);
        opacity:0.3;
    }
}

</style>
</head>

<body>

<div class="sparkle s1"></div>
<div class="sparkle s2"></div>
<div class="sparkle s3"></div>
<div class="sparkle s4"></div>

<img src="wanmow_logo.png" class="cafe-logo">

<div class="center">

<img src="wan_logo.png" class="main-logo">

<div class="title">
結果発表
</div>

<div class="sub">
WANMO OSHIINU GRAND PRIX
</div>

</div>

</body>
</html>
