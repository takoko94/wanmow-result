<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>わんも～推し犬総選挙 結果発表</title>

<style>

@font-face{
    font-family:'Panda';
    src:url('pandabakery.ttf');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#ead1a3;

    overflow:hidden;
}

/* =========================
   1280×720 固定
========================= */

.stage{
    position:relative;

    width:1280px;
    height:720px;

    overflow:hidden;

    border-radius:24px;

    background:
    url('haikei.png')
    center center / cover no-repeat;

    box-shadow:
    0 25px 60px rgba(0,0,0,0.18);
}

/* 背景ふんわり */

.stage::before{
    content:'';

    position:absolute;
    inset:0;

    background:
    rgba(255,255,255,0.05);

    backdrop-filter:blur(1.5px);

    z-index:0;
}

/* =========================
   右下ロゴ
========================= */

.cafe-logo{
    position:absolute;

    right:32px;
    bottom:28px;

    width:165px;

    z-index:3;

    opacity:0;

    filter:
    drop-shadow(0 6px 16px rgba(0,0,0,0.15));

    animation:
    fadeUp 1.5s ease forwards;

    animation-delay:1.2s;
}

/* =========================
   真ん中
========================= */

.center{
    position:absolute;

    inset:0;

    z-index:2;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding-bottom:10px;
}

/* =========================
   メインロゴ
========================= */

.main-logo{
    width:720px; /* ← 小さくした */

    max-width:88%;

    filter:
    drop-shadow(0 12px 25px rgba(0,0,0,0.18));

    animation:
    logoFloat 4s ease-in-out infinite,
    fadeMain 1.4s ease;
}

/* =========================
   結果発表
========================= */

.title{
    margin-top:4px;

    font-family:'Panda';

    font-size:105px;

    line-height:1;

    color:#ff8fb0;

    letter-spacing:6px;

    opacity:0;

    text-shadow:
    0 0 0 #fff,
    0 5px 0 #fff,
    0 10px 25px rgba(255,143,176,0.45);

    animation:
    fadeUp 1.4s ease forwards;

    animation-delay:0.5s;
}

/* =========================
   サブタイトル
========================= */

.sub{
    margin-top:18px;

    font-family:'Panda';

    font-size:24px;

    letter-spacing:6px;

    color:#9a7b68;

    opacity:0;

    animation:
    fadeUp 1.5s ease forwards;

    animation-delay:0.9s;
}

/* =========================
   キラキラ
========================= */

.sparkle{
    position:absolute;

    border-radius:50%;

    opacity:0.8;

    z-index:1;

    animation:
    sparkle 3s infinite ease-in-out;
}

/* 星 */

.star{
    width:14px;
    height:14px;

    background:#ffe780;

    clip-path:polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 91%,
    50% 70%,
    21% 91%,
    32% 57%,
    2% 35%,
    39% 35%
    );
}

/* 肉球 */

.paw{
    width:22px;
    height:22px;

    background:#ffd8df;

    border-radius:50%;
}

/* 配置 */

.s1{
    top:80px;
    left:90px;
}

.s2{
    top:140px;
    right:160px;

    animation-delay:1s;
}

.s3{
    bottom:130px;
    left:160px;

    animation-delay:2s;
}

.s4{
    bottom:110px;
    right:230px;

    animation-delay:1.5s;
}

.s5{
    top:260px;
    left:250px;

    animation-delay:0.7s;
}

.s6{
    top:220px;
    right:300px;

    animation-delay:2.5s;
}

/* =========================
   アニメーション
========================= */

@keyframes fadeMain{
    from{
        opacity:0;
        transform:
        scale(0.94);
    }

    to{
        opacity:1;
        transform:
        scale(1);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:
        translateY(25px);
    }

    to{
        opacity:1;
        transform:
        translateY(0);
    }
}

@keyframes logoFloat{
    0%{
        transform:
        translateY(0px);
    }

    50%{
        transform:
        translateY(-10px);
    }

    100%{
        transform:
        translateY(0px);
    }
}

@keyframes sparkle{
    0%{
        transform:
        scale(0.8)
        rotate(0deg);

        opacity:0.3;
    }

    50%{
        transform:
        scale(1.3)
        rotate(8deg);

        opacity:1;
    }

    100%{
        transform:
        scale(0.8)
        rotate(0deg);

        opacity:0.3;
    }
}

</style>
</head>

<body>

<div class="stage">

<!-- キラキラ -->

<div class="sparkle star s1"></div>
<div class="sparkle star s2"></div>
<div class="sparkle star s3"></div>
<div class="sparkle star s4"></div>

<div class="sparkle paw s5"></div>
<div class="sparkle paw s6"></div>

<!-- わんも〜Cafeロゴ -->

<img
src="wanmow_logo.png"
class="cafe-logo"
>

<!-- 真ん中 -->

<div class="center">

<img
src="wan_logo.png"
class="main-logo"
>

<div class="title">
結果発表
</div>

<div class="sub">
WANMO OSHIINU GRAND PRIX
</div>

</div>

</div>

</body>
</html>
