<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280,height=720" />

<title>わんも～推し犬総選挙 結果発表</title>

<style>

/* =========================
   フォント
========================= */
@font-face{
  font-family:'Yasashisa';
  src:url('YasashisaGothicBold-V2.otf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:1280px;
  height:720px;
  overflow:hidden;

  font-family:'Yasashisa',sans-serif;
}

/* =========================
   メイン
========================= */
.main{
  position:relative;

  width:1280px;
  height:720px;

  overflow:hidden;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:url("haikei.png");
  background-size:cover;
  background-position:center;
}

/* =========================
   真ん中ロゴ
========================= */
.main-logo{
  width:520px;
  height:auto;

  margin-bottom:24px;

  filter:
    drop-shadow(0 8px 20px rgba(0,0,0,0.22));

  animation:float 4s ease-in-out infinite;
}

/* =========================
   結果発表
========================= */
.result{
  font-size:118px;
  color:#ffffff;

  letter-spacing:0.12em;

  text-shadow:
    0 6px 18px rgba(0,0,0,0.28),
    0 0 20px rgba(255,255,255,0.35);

  animation:float 4s ease-in-out infinite;
}

/* =========================
   右下ロゴ
========================= */
.corner-logo{
  position:absolute;

  right:34px;
  bottom:28px;

  width:155px;
  height:auto;

  opacity:0.96;

  filter:
    drop-shadow(0 4px 12px rgba(0,0,0,0.18));
}

/* =========================
   キラキラ
========================= */
.sparkle{
  position:absolute;

  border-radius:50%;

  background:rgba(255,255,255,0.9);

  animation:sparkle 3s ease-in-out infinite;
}

.sparkle:nth-child(1){
  width:14px;
  height:14px;
  top:90px;
  left:130px;
  animation-delay:0s;
}

.sparkle:nth-child(2){
  width:10px;
  height:10px;
  top:180px;
  right:240px;
  animation-delay:1s;
}

.sparkle:nth-child(3){
  width:16px;
  height:16px;
  bottom:160px;
  left:260px;
  animation-delay:2s;
}

.sparkle:nth-child(4){
  width:10px;
  height:10px;
  bottom:140px;
  right:200px;
  animation-delay:1.5s;
}

.sparkle:nth-child(5){
  width:8px;
  height:8px;
  top:300px;
  left:220px;
  animation-delay:0.5s;
}

.sparkle:nth-child(6){
  width:12px;
  height:12px;
  top:120px;
  right:140px;
  animation-delay:2.2s;
}

@keyframes sparkle{
  0%{
    opacity:0.2;
    transform:scale(0.7);
  }

  50%{
    opacity:1;
    transform:scale(1.2);
  }

  100%{
    opacity:0.2;
    transform:scale(0.7);
  }
}

/* =========================
   ふわふわ
========================= */
@keyframes float{
  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-8px);
  }

  100%{
    transform:translateY(0px);
  }
}

</style>
</head>

<body>

<div class="main">

  <!-- キラキラ -->
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>

  <!-- 真ん中ロゴ -->
  <img src="wan_logo.png" class="main-logo">

  <!-- 結果発表 -->
  <div class="result">
    結果発表
  </div>

  <!-- 右下ロゴ -->
  <img src="wanmow_logo.png" class="corner-logo">

</div>

</body>
</html>
