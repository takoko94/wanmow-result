<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280,height=720" />

<title>わんも～推し犬総選挙 結果発表</title>

<style>
/* =========================
   フォント
========================= */
@font-face{
  font-family:'Yasashisa';
  src:url('YasashisaGothicBold-V2.otf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:1280px;
  height:720px;
  overflow:hidden;

  font-family:'Yasashisa',sans-serif;

  background:#ffdfe8;
}

/* =========================
   メイン
========================= */
.main{
  position:relative;

  width:1280px;
  height:720px;

  overflow:hidden;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background-image:url("haikei.png");
  background-size:cover;
  background-position:center;
}

/* =========================
   キラキラ
========================= */
.sparkle{
  position:absolute;

  border-radius:50%;

  background:rgba(255,255,255,0.9);

  animation:sparkle 3s ease-in-out infinite;
}

.sparkle:nth-child(1){
  width:12px;
  height:12px;
  top:80px;
  left:120px;
  animation-delay:0s;
}

.sparkle:nth-child(2){
  width:8px;
  height:8px;
  top:180px;
  right:220px;
  animation-delay:1s;
}

.sparkle:nth-child(3){
  width:14px;
  height:14px;
  bottom:160px;
  left:260px;
  animation-delay:2s;
}

.sparkle:nth-child(4){
  width:10px;
  height:10px;
  bottom:120px;
  right:160px;
  animation-delay:1.5s;
}

@keyframes sparkle{
  0%{
    opacity:0.2;
    transform:scale(0.7);
  }

  50%{
    opacity:1;
    transform:scale(1.2);
  }

  100%{
    opacity:0.2;
    transform:scale(0.7);
  }
}

/* =========================
   ロゴ
========================= */
.logo{
  position:absolute;

  top:42px;
  right:42px;

  width:170px;
  height:auto;

  filter:
    drop-shadow(0 4px 12px rgba(0,0,0,0.18));

  z-index:5;
}

/* =========================
   サブタイトル
========================= */
.sub{
  margin-bottom:18px;

  font-size:34px;
  color:#ffffff;

  letter-spacing:0.15em;

  text-shadow:
    0 2px 8px rgba(0,0,0,0.25);
}

/* =========================
   タイトル
========================= */
.title{
  display:flex;
  flex-direction:column;
  align-items:center;

  line-height:1.1;

  color:#ffffff;

  text-shadow:
    0 4px 16px rgba(0,0,0,0.28),
    0 0 24px rgba(255,255,255,0.4);
}

.title-top{
  font-size:92px;
  letter-spacing:0.08em;
}

.title-bottom{
  margin-top:10px;

  font-size:120px;
  letter-spacing:0.12em;
}

/* =========================
   英字
========================= */
.slug{
  position:absolute;

  bottom:38px;

  font-size:28px;
  letter-spacing:0.18em;

  color:rgba(255,255,255,0.92);

  text-shadow:
    0 2px 8px rgba(0,0,0,0.22);
}

/* =========================
   ふわふわ
========================= */
.float{
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-8px);
  }

  100%{
    transform:translateY(0px);
  }
}

</style>
</head>

<body>

<div class="main">

  <!-- キラキラ -->
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>

  <!-- ロゴ -->
  <img src="wan_logo.png" class="logo" />

  <!-- タイトル -->
  <div class="title float">

    <div class="sub">
      わんも～Cafe Presents
    </div>

    <div class="title-top">
      わんも～推し犬総選挙
    </div>

    <div class="title-bottom">
      結果発表
    </div>

  </div>

  <!-- 英字 -->
  <div class="slug">
    wanmow cafe
  </div>

</div>

</body>
</html>
